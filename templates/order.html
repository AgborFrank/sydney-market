<!-- templates/order.html -->
{% extends 'base.html' %} {% block title %}Place Order - Sydney{% endblock %} {%
block content %}
<div class="container mx-auto px-4 py-8">
  <h1 class="text-lg font-bold text-white mb-6">
    Order: {{ product['title'] }}
  </h1>
  <div class="bg-white p-6 rounded-lg shadow-md">
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="mb-4">
        <label for="quantity" class="block text-gray-700 font-semibold mb-2"
          >Quantity:</label
        >
        <input
          type="number"
          name="quantity"
          id="quantity"
          value="1"
          min="1"
          max="{{ product['stock'] }}"
          class="w-24 px-2 py-1 border rounded"
          required
        />
      </div>
      <div class="mb-4">
        <label for="currency" class="block text-gray-700 font-semibold mb-2"
          >Currency:</label
        >
        <select
          name="currency"
          id="currency"
          class="w-32 px-2 py-1 border rounded"
        >
          <option value="BTC">BTC</option>
          {% if monero_available %}
          <option value="XMR">XMR</option>
          {% endif %}
        </select>
      </div>
      <button
        type="submit"
        class="bg-green-700 text-white font-semibold py-2 px-4 rounded-md hover:bg-green-800 transition duration-200"
      >
        Proceed to Payment
      </button>
    </form>
  </div>
</div>
{% endblock %}
