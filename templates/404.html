<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found - Marketplace</title>
    <link
      href="{{ url_for('static', filename='images/favicon.png') }}"
      rel="shortcut icon"
    />
    <title>{% block title %}{{ settings.site_name }}{% endblock %}</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='dist/styles.css') }}"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <link href="{{ url_for('static', filename='dist/media.css') }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    
  </head>
  <body
    class="bg-dark-950 text-gray-100 min-h-screen flex items-center justify-center"
  >
    <div class="max-w-2xl mx-auto px-6 text-center">
      <!-- 404 Icon -->
      <div class="mb-8">
        <div class="relative">
          <div
            class="w-32 h-32 mx-auto bg-gradient-to-br from-red-500 to-red-700 rounded-full flex items-center justify-center shadow-2xl"
          >
            <span class="text-6xl font-bold text-white">404</span>
          </div>
          <div
            class="absolute -top-2 -right-2 w-8 h-8 bg-yellow-500 rounded-full flex items-center justify-center"
          >
            <svg
              class="w-5 h-5 text-dark-950"
              fill="currentColor"
              viewBox="0 0 20 20"
            >
              <path
                fill-rule="evenodd"
                d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z"
                clip-rule="evenodd"
              ></path>
            </svg>
          </div>
        </div>
      </div>

      <!-- Error Message -->
      <h1 class="text-4xl md:text-6xl font-bold text-white mb-4">
        Page Not Found
      </h1>
      <p class="text-xl text-gray-400 mb-8 max-w-md mx-auto">
        The page you're looking for has vanished into the dark web. It might
        have been moved, deleted, or never existed.
      </p>

      <!-- Search Box -->
      <div class="mb-8">
        <div class="relative max-w-md mx-auto">
          <input
            type="text"
            placeholder="Search for products, vendors, or categories..."
            class="w-full px-4 py-3 bg-dark-800 border border-dark-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent"
          />
          <button class="absolute right-3 top-3 text-gray-400 hover:text-white">
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
              ></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex flex-col sm:flex-row gap-4 justify-center mb-8">
        <a
          href="/"
          class="px-6 py-3 bg-gradient-to-r from-red-600 to-red-700 hover:from-red-700 hover:to-red-800 text-white font-semibold rounded-lg transition-all duration-200 transform hover:scale-105 shadow-lg"
        >
          <svg
            class="w-5 h-5 inline mr-2"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
            ></path>
          </svg>
          Go Home
        </a>
        <a
          href="/search"
          class="px-6 py-3 bg-dark-800 hover:bg-dark-700 text-white font-semibold rounded-lg border border-dark-600 transition-all duration-200 transform hover:scale-105"
        >
          <svg
            class="w-5 h-5 inline mr-2"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            ></path>
          </svg>
          Browse Marketplace
        </a>
      </div>

      <!-- Popular Categories -->
      <div class="text-center">
        <h3 class="text-lg font-semibold text-white mb-4">
          Popular Categories
        </h3>
        <div class="flex flex-wrap justify-center gap-3">
          <a
            href="/category/electronics"
            class="px-4 py-2 bg-dark-800 hover:bg-dark-700 text-gray-300 rounded-full text-sm transition-colors duration-200"
          >
            Electronics
          </a>
          <a
            href="/category/security"
            class="px-4 py-2 bg-dark-800 hover:bg-dark-700 text-gray-300 rounded-full text-sm transition-colors duration-200"
          >
            Security
          </a>
          <a
            href="/category/software"
            class="px-4 py-2 bg-dark-800 hover:bg-dark-700 text-gray-300 rounded-full text-sm transition-colors duration-200"
          >
            Software
          </a>
          <a
            href="/category/services"
            class="px-4 py-2 bg-dark-800 hover:bg-dark-700 text-gray-300 rounded-full text-sm transition-colors duration-200"
          >
            Services
          </a>
        </div>
      </div>

      <!-- Footer Note -->
      <div class="mt-12 pt-8 border-t border-dark-800">
        <p class="text-sm text-gray-500">
          Need help? Contact our
          <a href="/support" class="text-red-400 hover:text-red-300 underline"
            >support team</a
          >
          or check our
          <a href="/faqs" class="text-red-400 hover:text-red-300 underline"
            >FAQ</a
          >
        </p>
      </div>
    </div>

    <!-- Background Pattern -->
    <div class="fixed inset-0 -z-10 opacity-5">
      <div
        class="relative inset-0 bg-gradient-to-br from-red-500/20 to-transparent"
      ></div>
      <div
        class="relative inset-0"
        style="
          background-image: radial-gradient(
            circle at 1px 1px,
            rgba(255, 255, 255, 0.1) 1px,
            transparent 0
          );
          background-size: 20px 20px;
        "
      ></div>
    </div>
  </body>
</html>
